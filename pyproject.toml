[project]
name = "rebuilt-sim"
version = "0.1.0"
description = "FRC 2026 REBUILT match simulator and reinforcement-learning environments (strategy track)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "gymnasium>=1.0",
    "pettingzoo>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
viz = ["pygame-ce>=2.5"]
train = ["torch>=2.3", "stable-baselines3>=2.3", "tensorboard>=2.16"]
dev = ["pytest>=8"]

# CPU-only PyTorch: the CUDA build needs ~5 GB of disk, and small MLP policies train
# just as fast on the CPU. For GPU training later, point this index at
# https://download.pytorch.org/whl/cu126 and re-run `uv sync --all-extras`.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rebuilt_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
